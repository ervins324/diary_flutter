name: diary_flutter
description: "School Diary Flutter mobile client with liquid glass UI and offline sync."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  liquid_glass_easy: 4.3.1
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  web_socket_channel: ^3.0.3
  uuid: ^4.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
